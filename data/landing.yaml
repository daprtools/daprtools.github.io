# Note: Template blocks require a 'weight' parameter so they're correctly ordered on the landing page

# Hero
hero:
  enable: true
  weight: 10
  template: hero

  backgroundImage:
    path: "images/templates/hero"
    filename:
      desktop: "gradient-desktop.webp"
      mobile: "gradient-mobile.webp"

  badge:
    text: v0.1.0
    color: primary # primary, secondary, success, danger, warning, info, light, dark
    pill: false # boolean
    soft: true # boolean

  # titleLogo:
  #   path: "images/logos"
  #   filename: "title_logo.png"
  #   alt: "Lotus Docs Logo"
  #   height: 80px

  title: "DaprDesigner"
  subtitle: Visually Model Microservices Architecture for [**Dapr.io**](https://dapr.io)

  image:
    path: "images" # path to image under configured assets directory. default 'images'
    filename: "AppBlocks.svg" # filename of your hero image (including file extension) "lotus_docs_screenshot.png"
    alt: "Lotus Docs Screenshot" # Optional but recommended
    boxShadow: true # default 'false' (excludes .svg images)
    rounded: true # round the image corners? default 'false' (excludes .svg images)

  ctaButton:
    icon: rocket_launch
    btnText: "Get started"
    url: "/docs"
  cta2Button:
    icon: code
    btnText: "See the code"
    url: "https://github.com/daprtools"

  info: "Apache 2 Licensed"

# Feature Grid
featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: What is DaprDesigner?
  subtitle: DaprDesigner is a powerful visual modeling tool built on Eclipse Sirius, designed to simplify the creation and management of microservices architectures using Dapr.io. It empowers architects and developers to visually design and configure their microservices, significantly reducing the complexity of Dapr integration.

  items:
    - title: Visual Microservices Modeling
      icon: polyline
      description: Design your microservices architecture with an intuitive drag-and-drop interface.

    - title: Dapr Component Configuration
      icon: grid_view
      description: Visually configure Dapr building blocks like state management, pub/sub, service invocation, and more.

    - title: Accurate YAML Generation
      icon: data_object
      description: Automatically generate precise Dapr component and application YAML files, ensuring consistency and reducing errors.

    - title: Eclipse Sirius Integration
      icon: code
      description: Leverages the robust and extensible [**Eclipse Sirius**](https://eclipse.dev/sirius/) platform.

    - title: Enhanced Architecture Understanding
      icon: architecture 
      description: Provides a clear visual representation of your microservices dependencies and interactions.

    - title: Rapid Prototyping
      icon: keyboard_double_arrow_right
      description: Quickly iterate and refine your microservices designs.

imageText:
  enable: true
  weight: 25
  template: image text

  title: Overcome Microservices Architecture Challenges with DaprDesigner
  subtitle: Designing and developing microservices architectures presents unique challenges. DaprDesigner addresses these head-on, empowering you to build robust and scalable systems.

  list:
    - text: Clear, visual representation, making it easier to grasp the overall architecture and identify potential bottlenecks.
      icon: rocket

    - text: Standardized configurations through visual modeling and automated YAML generation, minimizing inconsistencies.
      icon: rocket

    - text: Intuitive interface allows to quickly create, modify, and test architectural changes, accelerating the development lifecycle.
      icon: rocket

    - text: Visual abstraction, making it easier to understand and utilize Dapr's capabilities without deep technical expertise.
      icon: rocket  

    - text: Shared visual language, enabling architects and developers to communicate and collaborate more effectively.
      icon: rocket  
         

  image:
    path: "images/templates/single"
    filename: "google_lighthouse_circle_v1.0.svg"
    alt: "Google LightHouse 100% Illustration" # Optional but recommended

  imgOrder:
    desktop: 2
    mobile: 1



# Image compare
imageCompare:
  enable: true
  weight: 30
  template: image compare

  title: Adopt a new paradigm... for the better
  subtitle: Beyond Static Shapes... Build Dynamic, Deployable Microservices, Visually.

  items:
    - title: From static shapes to live models.
      config: {
        startingPoint: 50,
        addCircle: true,
        addCircleBlur: false,
        showLabels: true,
        labelOptions: {
          before: 'Dark',
          after: 'Light',
          onHover: false
        }
      }
      imagePath: "images/screenshots"
      imageBefore: "lotusdocs_dark_v0.8.webp"
      imageAfter: "lotusdocs_light_v0.8.webp"

    - title: From meaningless labels to meaningful configurations
      config: {
        controlColor: "#3C4257",
        startingPoint: 25,
        addCircle: true,
        addCircleBlur: false,
        showLabels: true,
        labelOptions: {
          before: 'Inter',
          after: 'Life Saver',
          onHover: false
        }
      }
      imagePath: "images/screenshots"
      imageBefore: "lotusdocs_google_font_demo_inter_screenshot.webp"
      imageAfter: "lotusdocs_google_font_demo_lifesavers_screenshot.webp"

    - title: From hand-coded YAMLs to auto-generated ones
      config: {
        startingPoint: 25,
        addCircle: true,
        addCircleBlur: true,
        showLabels: true,
        labelOptions: {
          before: 'Blue',
          after: 'Cardinal',
          onHover: false
        }
      }
      imagePath: "images/screenshots"
      imageBefore: "lotusdocs_blue_theme_colour.webp"
      imageAfter: "lotusdocs_cardinal_theme_colour.webp"